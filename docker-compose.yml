version: '3.8'
services:
  pgdi-mysql:
    image: mysql:8.0
    container_name: pgdi-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: pgdi_db
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./mysql_data:/var/lib/mysql
    networks:
      - pgdi-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build: ./backend
    container_name: pgdi-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://pgdi-mysql:3306/pgdi_db?createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: ${JWT_SECRET}
      API_UPLOAD_DIRECTORY: /app/uploads
    depends_on:
      pgdi-mysql:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
    networks:
      - pgdi-network

  frontend:
    build: ./frontend
    container_name: pgdi-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - pgdi-network

networks:
  pgdi-network:
    driver: bridge